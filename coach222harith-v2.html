<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#060608">
<title>Coach · Harith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pt:env(safe-area-inset-top,44px);
  --pb:env(safe-area-inset-bottom,34px);
  --bg:#060608;
  --s1:#0e0e14;
  --s2:#16161f;
  --s3:#1e1e2a;
  --brd:rgba(255,255,255,0.07);
  --brd2:rgba(255,255,255,0.12);
  --tx:#f0f0f8;
  --tx2:#8888aa;
  --tx3:#4a4a66;
  --swim:#00d4ff;
  --bike:#ff7240;
  --run:#00f07a;
  --rest:#3a3a55;
  --race:#ffc940;
  --train:#a78bfa;
  --r:18px;
  --tab-h:82px;
}
html{background:var(--bg);height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--tx);
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ─── SCROLL CONTAINER ─── */
.scroller{
  position:fixed;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  padding-bottom:calc(var(--tab-h) + 16px);
}

/* ─── TOP STATUS BAR SPACER ─── */
.status-bar{height:calc(var(--pt) + 2px);flex-shrink:0}

/* ─── TAB BAR ─── */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:999;
  height:var(--tab-h);
  background:rgba(6,6,8,0.82);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-top:1px solid var(--brd);
  display:flex;align-items:flex-start;
  padding-top:10px;
  padding-bottom:var(--pb);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;cursor:pointer;
  padding:6px 4px 0;
  transition:opacity .15s;
}
.tab:active{opacity:.6}
.tab-icon{
  width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  transition:background .2s,transform .15s;
}
.tab.active .tab-icon{
  background:rgba(255,255,255,0.12);
  transform:scale(1.08);
}
.tab-label{font-size:10px;font-weight:500;color:var(--tx3);letter-spacing:.02em;transition:color .2s}
.tab.active .tab-label{color:var(--tx)}

/* ─── PAGES ─── */
.page{display:none;min-height:100vh;padding:0 0 8px}
.page.active{display:block;animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ─── TODAY PAGE ─── */
.hero{
  position:relative;overflow:hidden;
  padding:calc(var(--pt) + 20px) 20px 28px;
  background:linear-gradient(170deg,#0c0c18 0%,#060608 70%);
}
.hero-glow{
  position:absolute;top:-60px;right:-40px;
  width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,212,255,.12),transparent 70%);
  pointer-events:none;
}
.hero-glow2{
  position:absolute;bottom:-80px;left:-60px;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,240,122,.07),transparent 70%);
  pointer-events:none;
}
.hero-greeting{font-size:13px;font-weight:500;color:var(--tx2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:42px;line-height:.95;letter-spacing:.01em;margin-bottom:14px}
.hero-title span{color:var(--swim)}
.phase-chip{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--brd2);border-radius:100px;
  padding:6px 14px;font-size:12px;font-weight:500;color:var(--tx2);
}
.phase-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ─── COUNTDOWN PILLS ─── */
.countdown-row{display:flex;gap:10px;padding:16px 16px 0}
.cd-pill{
  flex:1;background:var(--s2);border:1px solid var(--brd);border-radius:16px;
  padding:14px 16px;position:relative;overflow:hidden;
}
.cd-pill::before{
  content:'';position:absolute;top:-20px;right:-20px;
  width:80px;height:80px;border-radius:50%;
  opacity:.15;
}
.cd-pill.r1::before{background:var(--race)}
.cd-pill.r2::before{background:var(--swim)}
.cd-days{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1}
.cd-pill.r1 .cd-days{color:var(--race)}
.cd-pill.r2 .cd-days{color:var(--swim)}
.cd-label{font-size:10px;color:var(--tx3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.cd-name{font-size:11px;font-weight:600;color:var(--tx2);margin-top:6px}

/* ─── PROGRESS ─── */
.prog-wrap{margin:16px 16px 0;background:var(--s2);border:1px solid var(--brd);border-radius:16px;padding:16px}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-label{font-size:12px;font-weight:600;color:var(--tx2)}
.prog-val{font-size:12px;font-weight:700;color:var(--tx)}
.prog-track{height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--swim),var(--run));transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.prog-phases{display:flex;gap:3px;margin-top:8px}
.prog-phase-seg{height:3px;border-radius:2px;flex:1;opacity:.4}

/* ─── SECTION HEADER ─── */
.sec{padding:20px 16px 10px;font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase}

/* ─── WORKOUT CARD ─── */
.wo-card{
  margin:0 16px 10px;
  background:var(--s1);
  border:1px solid var(--brd);border-radius:var(--r);
  overflow:hidden;cursor:pointer;
  transition:transform .12s,border-color .15s;
  position:relative;
}
.wo-card:active{transform:scale(.98)}
.wo-card.done{opacity:.45}
.wo-card-inner{display:flex;align-items:center;gap:13px;padding:14px 16px}
.sport-icon{
  width:44px;height:44px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.si-swim{background:rgba(0,212,255,.1)}
.si-bike{background:rgba(255,114,64,.1)}
.si-run{background:rgba(0,240,122,.1)}
.si-rest{background:rgba(58,58,85,.25)}
.si-race{background:rgba(255,201,64,.1)}
.si-train{background:rgba(167,139,250,.1)}
.wo-info{flex:1;min-width:0}
.wo-name{font-size:15px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.wo-tag{font-size:11px;color:var(--tx3);font-weight:500}
.wo-sep{width:3px;height:3px;border-radius:50%;background:var(--tx3)}
.check-btn{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--brd2);background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--tx3);flex-shrink:0;
  transition:all .2s;
}
.check-btn.done-c{background:var(--run);border-color:var(--run);color:#000}
.wo-accent{
  position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:var(--r) 0 0 var(--r);
}

/* ─── SLEEP NUDGE ─── */
.sleep-nudge{
  margin:16px 16px 0;
  background:linear-gradient(135deg,rgba(0,240,122,.07),rgba(0,212,255,.05));
  border:1px solid rgba(0,240,122,.15);border-radius:16px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;
}
.sleep-icon{font-size:26px}
.sleep-text .sleep-t{font-size:12px;font-weight:700;color:var(--run)}
.sleep-text .sleep-s{font-size:11px;color:var(--tx2);margin-top:2px;line-height:1.4}

/* ─── WEEKS PAGE ─── */
.week-list{padding:calc(var(--pt) + 8px) 0 0}
.week-item{
  margin:0 16px 8px;
  background:var(--s1);border:1px solid var(--brd);
  border-radius:var(--r);overflow:hidden;
}
.week-item.current{border-color:var(--swim)}
.week-hdr{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  cursor:pointer;user-select:none;
}
.week-hdr:active{background:rgba(255,255,255,.02)}
.week-num-badge{
  font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;
  color:var(--tx3);min-width:32px;
}
.week-item.current .week-num-badge{color:var(--swim)}
.week-hdr-info{flex:1;min-width:0}
.week-hdr-phase{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.week-hdr-focus{font-size:13px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-hdr-right{text-align:right;flex-shrink:0}
.week-hrs{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1}
.week-date-small{font-size:10px;color:var(--tx3);font-weight:500;margin-top:1px}
.rec-tag{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#ffc940;background:rgba(255,201,64,.1);border:1px solid rgba(255,201,64,.2);border-radius:6px;padding:2px 6px;margin-top:4px}

/* week expand */
.week-body{display:none;border-top:1px solid var(--brd);padding:12px 16px}
.week-body.open{display:block}
.day-block{padding:8px 0;border-bottom:1px solid var(--brd)}
.day-block:last-child{border-bottom:none}
.day-lbl{font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.wo-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--s2);border-radius:10px;padding:8px 10px;
  margin-bottom:4px;cursor:pointer;
  transition:background .12s;
}
.wo-pill:active{background:var(--s3)}
.wo-pill:last-child{margin-bottom:0}
.pill-emoji{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.pill-name{flex:1;font-size:12px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-dur{font-size:11px;color:var(--tx3);flex-shrink:0}
.pill-done{font-size:11px;flex-shrink:0;opacity:.6}

/* ─── PHASES PAGE ─── */
.phases-wrap{padding:calc(var(--pt) + 8px) 16px 0}
.phase-card{
  background:var(--s1);border:1px solid var(--brd);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;cursor:pointer;
}
.phase-top{display:flex;align-items:center;gap:14px;padding:16px}
.phase-circle{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.phase-info{flex:1;min-width:0}
.phase-name-txt{font-size:15px;font-weight:700}
.phase-dates-txt{font-size:11px;color:var(--tx3);margin-top:3px}
.phase-wks-badge{
  font-family:'Bebas Neue',sans-serif;font-size:20px;
  padding:4px 10px;border-radius:8px;flex-shrink:0;
}
.phase-detail{display:none;border-top:1px solid var(--brd);padding:14px 16px}
.phase-detail.open{display:block}
.phase-focus-txt{font-size:13px;color:var(--tx2);line-height:1.7;margin-bottom:12px}
.milestone-pill{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--s2);border-radius:12px;padding:12px 14px;
}
.ms-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.ms-text{font-size:12px;color:var(--tx2);line-height:1.5}
.ms-text strong{color:var(--run)}

/* ─── RACES PAGE ─── */
.races-wrap{padding:calc(var(--pt) + 8px) 16px 0}
.race-card{
  border-radius:20px;overflow:hidden;margin-bottom:12px;
  position:relative;
}
.race-card-bg{
  padding:22px 20px 20px;position:relative;
}
.race-card-bg::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04),transparent);
  pointer-events:none;
}
.race-emoji{font-size:32px;margin-bottom:10px;display:block}
.race-name{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;letter-spacing:.02em}
.race-countdown-inline{
  font-size:13px;font-weight:600;margin-top:4px;opacity:.7;
}
.race-dists{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.rdist{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.25);border-radius:20px;
  padding:6px 12px;font-size:13px;font-weight:600;
  backdrop-filter:blur(8px);
}
.strat-section{margin-bottom:10px}
.strat-hdr{font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase;padding:16px 0 10px}
.strat-card{
  background:var(--s1);border:1px solid var(--brd);border-radius:14px;
  padding:14px 16px;margin-bottom:8px;
}
.strat-sport-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.strat-sport-name{font-size:14px;font-weight:700}
.strat-body{font-size:13px;color:var(--tx2);line-height:1.75}
.strat-body strong{color:var(--tx);font-weight:600}

/* ─── PROFILE PAGE ─── */
.profile-wrap{padding:calc(var(--pt) + 8px) 16px 0}
.profile-hero{
  background:var(--s1);border:1px solid var(--brd);border-radius:20px;
  padding:24px 20px;margin-bottom:10px;text-align:center;
  position:relative;overflow:hidden;
}
.profile-hero::before{
  content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,212,255,.08),transparent 70%);
}
.profile-av{
  width:72px;height:72px;border-radius:50%;margin:0 auto 12px;
  background:linear-gradient(135deg,var(--swim),var(--run));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;position:relative;
}
.profile-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em}
.profile-sub{font-size:12px;color:var(--tx3);font-weight:500;margin-top:4px;letter-spacing:.05em}
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat4-cell{
  background:var(--s1);border:1px solid var(--brd);border-radius:14px;
  padding:16px;text-align:center;
}
.stat4-v{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1}
.stat4-l{font-size:10px;color:var(--tx3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.info-block{
  background:var(--s1);border:1px solid var(--brd);border-radius:16px;
  padding:16px;margin-bottom:10px;
}
.info-block-title{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.info-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--brd);font-size:13px;
}
.info-row:last-child{border-bottom:none}
.info-lbl{color:var(--tx2);font-weight:400}
.info-val{font-weight:600}

/* ─── MODAL ─── */
.modal-scrim{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  align-items:flex-end;
}
.modal-scrim.open{display:flex;animation:scrimIn .2s ease both}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.modal-sheet{
  width:100%;max-height:88dvh;
  background:var(--s2);
  border-radius:24px 24px 0 0;
  border-top:1px solid var(--brd2);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--pb) + 16px);
  animation:sheetUp .28s cubic-bezier(.32,0,.67,0) both;
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin:14px auto 6px}
.sheet-hero{padding:10px 20px 18px;border-bottom:1px solid var(--brd)}
.sheet-sport-row{display:flex;align-items:center;gap:14px}
.sheet-sport-badge{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.sheet-title{font-size:19px;font-weight:700;line-height:1.2}
.sheet-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sheet-tag{
  background:rgba(255,255,255,.06);border-radius:8px;
  padding:3px 10px;font-size:11px;font-weight:600;color:var(--tx2);
}
.sheet-body{padding:18px 20px}
.sheet-desc{font-size:14px;color:var(--tx2);line-height:1.7;margin-bottom:16px}
.sheet-instructions{
  background:var(--s3);border-radius:14px;padding:16px;
  font-size:13px;line-height:1.9;white-space:pre-wrap;color:var(--tx);
}
.sheet-btn{
  margin:18px 20px 0;width:calc(100% - 40px);padding:15px;
  border-radius:14px;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.02em;transition:all .15s;
}
.sheet-btn.mark{background:var(--run);color:#000}
.sheet-btn.unmark{background:rgba(255,255,255,.08);color:var(--tx2);border:1px solid var(--brd2)}
.sheet-btn:active{transform:scale(.97)}

/* ─── UTILS ─── */
.no-workouts{padding:24px;text-align:center;color:var(--tx3);font-size:14px;line-height:1.7}
</style>
</head>
<body>

<!-- PAGES -->
<div class="scroller" id="scroller">
  <div id="p-today" class="page active"></div>
  <div id="p-weeks" class="page"></div>
  <div id="p-phases" class="page"></div>
  <div id="p-races" class="page"></div>
  <div id="p-profile" class="page"></div>
</div>

<!-- TAB BAR -->
<div class="tabbar">
  <button class="tab active" data-page="today" onclick="nav('today')">
    <div class="tab-icon">⚡️</div>
    <div class="tab-label">Today</div>
  </button>
  <button class="tab" data-page="weeks" onclick="nav('weeks')">
    <div class="tab-icon">📅</div>
    <div class="tab-label">Weeks</div>
  </button>
  <button class="tab" data-page="phases" onclick="nav('phases')">
    <div class="tab-icon">📈</div>
    <div class="tab-label">Plan</div>
  </button>
  <button class="tab" data-page="races" onclick="nav('races')">
    <div class="tab-icon">🏁</div>
    <div class="tab-label">Races</div>
  </button>
  <button class="tab" data-page="profile" onclick="nav('profile')">
    <div class="tab-icon">👤</div>
    <div class="tab-label">Profile</div>
  </button>
</div>

<!-- WORKOUT SHEET -->
<div class="modal-scrim" id="modal-scrim" onclick="closeSheet(event)">
  <div class="modal-sheet" id="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hero">
      <div class="sheet-sport-row">
        <div class="sheet-sport-badge" id="sh-badge"></div>
        <div>
          <div class="sheet-title" id="sh-title"></div>
          <div class="sheet-meta" id="sh-meta"></div>
        </div>
      </div>
    </div>
    <div class="sheet-body">
      <div class="sheet-desc" id="sh-desc"></div>
      <div class="sheet-instructions" id="sh-instr"></div>
    </div>
    <button class="sheet-btn mark" id="sh-btn" onclick="toggleFromSheet()"></button>
  </div>

// ── SPORT CONFIG ──
const SP={
  swim:{e:'🏊',cls:'si-swim',color:'var(--swim)'},
  bike:{e:'🚴',cls:'si-bike',color:'var(--bike)'},
  run:{e:'🏃',cls:'si-run',color:'var(--run)'},
  rest:{e:'😴',cls:'si-rest',color:'var(--rest)'},
  race:{e:'🏁',cls:'si-race',color:'var(--race)'},
  training:{e:'💪',cls:'si-train',color:'var(--train)'}
};
function sp(s){return SP[s]||SP.training}

const PH_COLORS=['#00d4ff','#3a9fff','#ff7240','#ffc940','#a78bfa','#ec4899','#ffc940'];
function phColor(id){return PH_COLORS[(id||1)-1]||'#8888aa'}

// ── STORAGE ──
let done={};
try{done=JSON.parse(localStorage.getItem('done')||'{}')}catch{}
function saveDone(){try{localStorage.setItem('done',JSON.stringify(done))}catch{}}
function toggle(id){done[id]=!done[id];saveDone();return done[id]}
function isDone(id){return!!done[id]}

// ── DATE ──
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
}
function daysTo(iso){
  const n=new Date();n.setHours(0,0,0,0);
  return Math.ceil((new Date(iso+'T00:00:00')-n)/86400000)
}
function fmtDate(iso){
  return new Date(iso+'T00:00:00').toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})
}
function curWeek(){
  const td=todayStr();
  return PLAN.weeks.find(w=>w.startDate<=td&&w.endDate>=td)||PLAN.weeks[0]
}
function todayDay(){
  const td=todayStr(),wk=curWeek();
  return wk&&wk.days?wk.days.find(d=>d.date===td):null
}

// ── NAV ──
let curPage='today';
function nav(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('p-'+page).classList.add('active');
  document.querySelector('[data-page="'+page+'"]').classList.add('active');
  document.getElementById('scroller').scrollTop=0;
  curPage=page;
  if(page==='today')renderToday();
  else if(page==='weeks')renderWeeks();
  else if(page==='phases')renderPhases();
  else if(page==='races')renderRaces();
  else if(page==='profile')renderProfile();
}

// ── SHEET ──
let sheetWo=null;
function openSheet(wo){
  sheetWo=wo;
  const s=sp(wo.sport);
  const b=document.getElementById('sh-badge');
  b.className='sheet-sport-badge '+s.cls;
  b.textContent=s.e;
  document.getElementById('sh-title').textContent=wo.name;
  const metas=[];
  if(wo.durationMinutes)metas.push(wo.durationMinutes+'min');
  if(wo.distanceKm)metas.push(wo.distanceKm+'km');
  if(wo.distanceMeters)metas.push(wo.distanceMeters+'m');
  if(wo.primaryZone)metas.push(wo.primaryZone);
  document.getElementById('sh-meta').innerHTML=metas.map(m=>`<div class="sheet-tag">${m}</div>`).join('');
  const desc=document.getElementById('sh-desc');
  desc.textContent=wo.description||'';
  desc.style.display=wo.description?'block':'none';
  const instr=document.getElementById('sh-instr');
  const txt=wo.humanReadable||wo.coachNotes||'';
  instr.textContent=txt;
  instr.style.display=txt?'block':'none';
  const btn=document.getElementById('sh-btn');
  if(wo.sport==='rest'){btn.style.display='none'}
  else{
    btn.style.display='block';
    const d=isDone(wo.id);
    btn.textContent=d?'✓ Completed — Tap to Undo':'Mark as Done';
    btn.className='sheet-btn '+(d?'unmark':'mark');
  }
  document.getElementById('modal-scrim').classList.add('open');
}
function closeSheet(e){
  if(!e||e.target===document.getElementById('modal-scrim')){
    document.getElementById('modal-scrim').classList.remove('open');
    if(curPage==='today')renderToday();
    else if(curPage==='weeks')renderWeeks();
  }
}
function toggleFromSheet(){
  if(!sheetWo)return;
  toggle(sheetWo.id);
  const d=isDone(sheetWo.id);
  const btn=document.getElementById('sh-btn');
  btn.textContent=d?'✓ Completed — Tap to Undo':'Mark as Done';
  btn.className='sheet-btn '+(d?'unmark':'mark');
}

// ── WO CARD HTML ──
function woCardHtml(wo){
  const s=sp(wo.sport);
  const d=isDone(wo.id);
  const metas=[];
  if(wo.durationMinutes)metas.push(wo.durationMinutes+' min');
  if(wo.distanceKm)metas.push(wo.distanceKm+' km');
  if(wo.distanceMeters)metas.push(wo.distanceMeters+' m');
  if(wo.primaryZone)metas.push(wo.primaryZone);
  const safeWo=JSON.stringify(wo).replace(/\\/g,'\\\\').replace(/`/g,'\`');
  return `<div class="wo-card${d?' done':''}" onclick="openSheet(JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(wo))}')))" >
    <div class="wo-accent" style="background:${s.color}"></div>
    <div class="wo-card-inner">
      <div class="sport-icon ${s.cls}">${s.e}</div>
      <div class="wo-info">
        <div class="wo-name">${wo.name}</div>
        <div class="wo-meta">${metas.map((m,i)=>i?`<span class="wo-sep"></span><span class="wo-tag">${m}</span>`:`<span class="wo-tag">${m}</span>`).join('')}</div>
      </div>
      <button class="check-btn${d?' done-c':''}" onclick="event.stopPropagation();toggle('${wo.id}');renderToday();">${d?'✓':''}</button>
    </div>
  </div>`;
}

// ── RENDER TODAY ──
function renderToday(){
  const td=todayStr(),wk=curWeek(),day=todayDay();
  const r1=daysTo('2026-11-08'),r2=daysTo('2027-02-14');
  const color=wk?phColor(wk.phaseId):'#8888aa';
  const pct=wk?Math.min(100,Math.round(((wk.weekNumber-1)/PLAN.weeks.length)*100)):0;

  let h=`
  <div class="hero">
    <div class="hero-glow"></div><div class="hero-glow2"></div>
    <div class="hero-greeting">Today · ${fmtDate(td)}</div>
    <div class="hero-title">Let's <span>Train</span></div>`;

  if(wk){
    h+=`<div class="phase-chip">
      <span class="phase-dot" style="background:${color}"></span>
      ${wk.phase} · Week ${wk.weekNumber}${wk.isRecoveryWeek?' · Recovery':''}
    </div>`;
  }
  h+=`</div>`;

  // Countdown
  h+=`<div class="countdown-row">
    <div class="cd-pill r1">
      <div class="cd-days">${r1>0?r1:'🏁'}</div>
      <div class="cd-label">Days to</div>
      <div class="cd-name">Olympic Tri · Nov 8</div>
    </div>
    <div class="cd-pill r2">
      <div class="cd-days">${r2>0?r2:'🏁'}</div>
      <div class="cd-label">Days to</div>
      <div class="cd-name">Ironman 70.3 · Feb 14</div>
    </div>
  </div>`;

  // Progress bar
  if(wk){
    h+=`<div class="prog-wrap">
      <div class="prog-row"><span class="prog-label">Season Progress</span><span class="prog-val">Week ${wk.weekNumber} of ${PLAN.weeks.length}</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-phases">${PLAN.phases.map(p=>`<div class="prog-phase-seg" style="background:${phColor(p.id)};flex:${p.weeks.includes('-')?parseInt(p.weeks.split('-')[1])-parseInt(p.weeks.split('-')[0])+1:1}"></div>`).join('')}</div>
    </div>`;
  }

  // Sleep nudge
  h+=`<div class="sleep-nudge">
    <div class="sleep-icon">🌙</div>
    <div class="sleep-text">
      <div class="sleep-t">TARGET 7.5 HRS SLEEP</div>
      <div class="sleep-s">82 min daily debt from WHOOP. Sleep is your #1 performance gain.</div>
    </div>
  </div>`;

  // Workouts
  h+=`<div class="sec">Today's Sessions</div>`;
  if(day&&day.workouts&&day.workouts.length){
    day.workouts.forEach(wo=>{h+=woCardHtml(wo)});
  } else {
    h+=`<div class="no-workouts">No training data for today.<br>Check the Weeks tab for your schedule.</div>`;
  }

  document.getElementById('p-today').innerHTML=h;
}

// ── RENDER WEEKS ──
function renderWeeks(){
  const td=todayStr();
  let h='<div class="week-list">';
  PLAN.weeks.forEach(wk=>{
    const cur=wk.startDate<=td&&wk.endDate>=td;
    const c=phColor(wk.phaseId);
    h+=`<div class="week-item${cur?' current':''}" id="wi-${wk.weekNumber}">
      <div class="week-hdr" onclick="toggleWk(${wk.weekNumber})">
        <div class="week-num-badge">${wk.weekNumber}</div>
        <div class="week-hdr-info">
          <div class="week-hdr-phase" style="color:${c}">${wk.phase}</div>
          <div class="week-hdr-focus">${wk.focus}</div>
        </div>
        <div class="week-hdr-right">
          <div class="week-hrs" style="color:${c}">${wk.targetHours}h</div>
          <div class="week-date-small">${wk.startDate.slice(5)}</div>
          ${wk.isRecoveryWeek?'<div class="rec-tag">Recovery</div>':''}
        </div>
      </div>`;

    const hasDetail=wk.days&&wk.days.some(d=>d.workouts&&d.workouts.length);
    if(hasDetail||wk.coachNotes){
      h+=`<div class="week-body${cur?' open':''}" id="wb-${wk.weekNumber}">`;
      if(wk.days){
        wk.days.forEach(day=>{
          const wos=day.workouts||[];
          h+=`<div class="day-block"><div class="day-lbl">${day.dayOfWeek.slice(0,3)}</div>`;
          wos.forEach(wo=>{
            const s=sp(wo.sport);
            const dur=wo.durationMinutes?wo.durationMinutes+'m':'';
            h+=`<div class="wo-pill" onclick="openSheet(JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(wo))}')))" >
              <span class="pill-emoji">${s.e}</span>
              <span class="pill-name">${wo.name}</span>
              <span class="pill-dur">${dur}</span>
              ${isDone(wo.id)?'<span class="pill-done">✓</span>':''}
            </div>`;
          });
          h+=`</div>`;
        });
      } else if(wk.coachNotes){
        h+=`<div style="font-size:13px;color:var(--tx2);line-height:1.7;padding:4px 0">${wk.coachNotes}</div>`;
      }
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  h+='</div>';
  document.getElementById('p-weeks').innerHTML=h;
  // scroll to current
  setTimeout(()=>{
    const el=document.querySelector('.week-item.current');
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'})}
  },100);
}
function toggleWk(n){
  const el=document.getElementById('wb-'+n);
  if(el)el.classList.toggle('open');
}

      <div class="strat-sport-row"><span style="font-size:18px">🏃</span><span class="strat-sport-name" style="color:var(--run)">Run · 21km</span></div>

    </div>
  </div></div>`;

  document.getElementById('p-races').innerHTML=h;
}
